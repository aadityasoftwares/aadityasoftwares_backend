name: Aaditya Softwares Backend Docker Build

on:
    push:
        branches:
            - staging
            - production

    workflow_dispatch:

permissions:
    contents: read
    packages: write

jobs:
    build:
        name: Build and Publish Docker Image
        runs-on: ubuntu-latest

        steps:
            - name: Checkout source code
              uses: actions/checkout@v6

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: |
                      ghcr.io/aadityasoftwares/aadityasoftwaresbackend
                      ghcr.io/aadityasoftwares/aadityasoftwares_backend
                  tags: |
                      type=raw,value=${{ github.ref_name }}
                      type=raw,value=${{ github.ref_name }}-${{ github.sha }}
                      type=raw,value=${{ github.sha }}
                      type=raw,value=latest,enable=${{ github.ref_name == 'production' }}

            - name: Build and publish Docker image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}

